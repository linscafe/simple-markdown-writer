[package]
name = "mdw"
version = "0.1.0"
description = "A single-file Markdown editor"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"
libc = "0.2"
pathdiff = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
toml = "0.8"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
url = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
panic = "abort"
