name: Release

# Push a tag like v0.1.0 to build the Linux packages and attach them to a draft
# GitHub Release. "Run workflow" builds them as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35) so the packages also run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Checks
        run: |
          npm run check
          cd src-tauri && cargo test

      - name: Build and attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mdw ${{ github.ref_name }}
          releaseBody: |
            Fedora: `sudo dnf install ./mdw-*.x86_64.rpm`
            Debian/Ubuntu: `sudo apt install ./mdw_*_amd64.deb`
            Any distribution: `chmod +x mdw_*.AppImage && ./mdw_*.AppImage`
          releaseDraft: true

      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          NO_STRIP: "true"
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
