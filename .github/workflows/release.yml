name: Release

# Push a tag like v0.1.0 to build the Linux packages and attach them to a draft
# GitHub Release. "Run workflow" builds them as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35) so the packages also run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Checks
        run: |
          npm run check
          cd src-tauri && cargo test

      - name: Build
        env:
          NO_STRIP: "true"
        run: npx tauri build

      # Fixed names keep the README's releases/latest/download links valid for every version.
      - name: Collect packages
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir release-packages
          cp $bundle/deb/*.deb release-packages/mdw_amd64.deb
          cp $bundle/rpm/*.rpm release-packages/mdw.x86_64.rpm
          cp $bundle/appimage/*.AppImage release-packages/mdw_x86_64.AppImage

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Linux x86_64 packages. They run on Debian 12+, Ubuntu 22.04+ and current Fedora.

          - Debian/Ubuntu: `sudo apt install ./mdw_amd64.deb`
          - Fedora: `sudo dnf install ./mdw.x86_64.rpm`
          - Any distribution: `chmod +x mdw_x86_64.AppImage && ./mdw_x86_64.AppImage`
          NOTES
          gh release create "$GITHUB_REF_NAME" release-packages/* --draft \
            --title "mdw $GITHUB_REF_NAME" --notes-file notes.md

      - uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: linux-packages
          path: release-packages/*
